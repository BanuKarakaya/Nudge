# Standalone alternative for an existing PostgreSQL server.
# Set DATABASE_URL in .env to that server before starting this stack.
services:
  app:
    init: true
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8080"
      NUDGY_CODEX_STATE_DIR: /var/lib/nudgy/codex
    ports:
      - "127.0.0.1:${NUDGY_HTTP_PORT:-8080}:8080"
    volumes:
      - nudge-codex-data:/var/lib/nudgy/codex
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health/db').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
volumes:
  nudge-codex-data:
