name: Agent safety evaluations
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Install pinned harness
        run: |
          npm install --prefix "$RUNNER_TEMP/native" --ignore-scripts --no-audit --no-fund @openai/codex@0.164.0
          echo "NUDGY_TEST_CODEX_BINARY=$RUNNER_TEMP/native/node_modules/.bin/codex" >> "$GITHUB_ENV"
      - name: Repeat safety, routing and native protocol cases without paid inference
        shell: bash
        run: |
          set -o pipefail
          go test -json -count=3 ./internal/codex ./internal/coding ./internal/service ./internal/slack | tee eval-results.jsonl
      - name: Summarize per-case pass rates
        if: always()
        run: python3 scripts/eval-summary.py eval-results.jsonl >> "$GITHUB_STEP_SUMMARY"
